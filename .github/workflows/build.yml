name: build

on:
  push:
    branches: [ master ]
  # publish.yml runs this before publishing a release tag.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Matches the node:24 base image in the Dockerfile.
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck

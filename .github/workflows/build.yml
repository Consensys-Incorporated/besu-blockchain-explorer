name: build

on:
  push:
    branches: [ master ]
  # publish.yml runs this before publishing a release tag.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Matches the node:24 base image in the Dockerfile.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck

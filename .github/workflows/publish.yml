name: publish

on:
  push:
    # Releases are plain x.y.z tags 
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publishDocker:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write
    environment: publish
    outputs:
      image_digest: ${{ steps.dockerPush.outputs.digest }}
    steps:
      # npm runs in build.yml, not here: every step in this job can mint an OIDC
      # token for the publish environment (id-token: write).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The arm64 image runs npm ci and next build under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull base images through the GCR mirror, falling back to docker.io when the mirror
          # is missing a blob.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: get workflow_details
        id: details
        shell: bash
        # Inputs go through env rather than ${{ }} in the script so they cannot inject shell
        # into a job that can push to Docker Hub.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # x.y.z also gets the x.y and latest tags
          if [[ ! $REF_NAME =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "Tag $REF_NAME is not x.y.z"
            exit 1
          fi
          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          dockertags="consensys/besu-blockchain-explorer:$REF_NAME,consensys/besu-blockchain-explorer:$major_minor,consensys/besu-blockchain-explorer:latest"
          echo "Creating dockertags: $dockertags"
          echo "dockertags=${dockertags}" >> "$GITHUB_OUTPUT"
      # Build before logging in: the emulated arm64 build is slow and the OIDC token is
      # short-lived, so only the push below runs on it.
      - name: build the combined manifest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          provenance: false
          push: false
          tags: ${{ steps.details.outputs.dockertags }}
      # Docker Hub OIDC: short-lived push token issued to the publish environment, no stored password.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: 600
        with:
          username: consensys
      # Same inputs as the build step, so every layer comes from the builder cache.
      - name: push the combined manifest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: dockerPush
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.details.outputs.dockertags }}

  scan:
    runs-on: ubuntu-latest
    needs: publishDocker
    permissions:
      contents: read
      security-events: write
    steps:
      # setting up trivy security scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: 'consensys/besu-blockchain-explorer@${{ needs.publishDocker.outputs.image_digest }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: 'trivy-results.sarif'

  signAndAttest:
    runs-on: ubuntu-24.04
    needs: publishDocker
    permissions:
      id-token: write
    environment: publish
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: consensys

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image with keyless cosign
        env:
          IMAGE_DIGEST: ${{ needs.publishDocker.outputs.image_digest }}
        run: |
          IMAGE=docker.io/consensys/besu-blockchain-explorer@$IMAGE_DIGEST
          echo "Signing $IMAGE"
          cosign sign --yes $IMAGE
      - name: Generate provenance file
        run: |
          BUILD_STARTED_ON="${{ github.event.head_commit.timestamp }}"
          # Fallback to current time if head_commit.timestamp is not available
          if [ -z "$BUILD_STARTED_ON" ]; then
            BUILD_STARTED_ON=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          BUILD_FINISHED_ON=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > provenance.json <<'EOF'
          {
            "buildType": "https://slsa.dev/container/v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow_ref }}"
            },
            "invocation": {
              "parameters": {
                "git_ref": "${{ github.ref }}",
                "git_sha": "${{ github.sha }}",
                "build_run_id": "${{ github.run_id }}",
                "build_run_number": "${{ github.run_number }}"
              }
            },
            "metadata": {
              "buildStartedOn": "__BUILD_STARTED_ON__",
              "buildFinishedOn": "__BUILD_FINISHED_ON__"
            },
            "source": {
              "repository": "https://github.com/${{ github.repository }}",
              "revision": "${{ github.sha }}"
            }
          }
          EOF
          sed -i "s/__BUILD_STARTED_ON__/$BUILD_STARTED_ON/" provenance.json
          sed -i "s/__BUILD_FINISHED_ON__/$BUILD_FINISHED_ON/" provenance.json
      - name: Attest cosign provenance
        env:
          IMAGE_DIGEST: ${{ needs.publishDocker.outputs.image_digest }}
        run: |
          IMAGE=docker.io/consensys/besu-blockchain-explorer@$IMAGE_DIGEST
          echo "Attesting provenance for $IMAGE"
          cosign attest --yes --predicate provenance.json --type slsaprovenance $IMAGE
